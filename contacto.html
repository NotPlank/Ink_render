<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨Ink Render - Contacto✨</title>
    <link class="ink-style-ref" rel="stylesheet" href="css/bootstrap.css">
    <link class="ink-style-ref" rel="stylesheet" href="estilo.css">
    <link rel="icon" type="image/jpg" href="imagenes/logofavicon.svg">

<body>
    <div class="wrapper">
        <div id="header-placeholder"></div>
        <main>
            <div class="container-fluid d-flex align-items-center justify-content-center py-4 entrada" id="principal"
                style="min-height: calc(100vh - 150px); padding-left: 5%; padding-right: 5%;">
                <div class="row justify-content-center w-100">
                    <div class="col-12 col-sm-12 col-md-11 col-lg-12 col-xl-12 d-flex justify-content-center">
                        <div class="xp-v w-100" style="max-width: 1400px;">
                            <div class="xp-t d-flex justify-content-between align-items-center p-2">
                                <span>Contacto</span>
                                <div class="d-flex gap-2">
                                    <div class="xp-btn">_</div>
                                    <div class="xp-btn">❐</div>
                                    <div class="xp-btn close" onclick="window.location.href='index.html'"
                                        style="cursor:pointer;" title="Cerrar y volver al inicio">X</div>
                                </div>
                            </div>
                            <div class="xp-c text-center" id="content">
                                <fieldset class="ink-fieldset">
                                    <legend class="ink-legend">Datos de contacto</legend>

                                    <label for="nombre" class="ink-label">Nombre:</label>
                                    <input id="nombre" required type="text" placeholder="Introduce tu nombre" class="ink-input">

                                    <label for="apellido" class="ink-label">Apellido:</label>
                                    <input id="apellido" type="text" placeholder="Introduce tu apellido"
                                        class="ink-input">
                                    <br>
                                    <label for="email" class="ink-label">Correo:</label>
                                    <input id="email" required placeholder="Introduce tu correo" type="email" class="ink-input">
                                    <br>
                                    <label for="mensaje" class="ink-label">¿En qué puedo ayudarte?</label>
                                    <textarea id="mensaje" placeholder="Escribe aquí tu duda, idea o proyecto..."
                                        class="ink-input" required rows="4" maxlength="400"></textarea>
                                    <br>
                                    <input class="enviar" value="Enviar" type="submit">
                                </fieldset>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </main>
        <div id="footer-placeholder"></div>
    </div>
    <style>
        .ink-input {
            margin: 10px;
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            border: 1.2px solid rgb(131, 22, 255);
            display: inline-block;
        }

        .ink-input:focus {
            outline: 0.5px solid rgb(137, 14, 231);
        }

        .ink-label {
            color: rgb(51, 51, 51);
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }

        .ink-textarea {
            border-radius: 10px;
            border: 2px solid rgb(90, 1, 207);
            margin: 15px;
            padding: 10px;
            font-family: 'Jacquard 12';
        }

        .ink-fieldset {
            border: 4px solid transparent;
            border-radius: 20px;
            background-color: rgba(232, 231, 248, 0.637);
            width: 100%;
            max-width: 75%;
            padding: 3rem 2rem;
            box-shadow: 15px 3px 20px #0004,
                -15px 0px 30px #0002;
            position: relative;
            transition: border-color 0.9 ease;
            margin: 1.5rem auto;
            justify-content: center;
        }
        .ink-legend {
            color: rgba(2, 2, 2, 0.991);
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 2.2rem;
            position: relative;
            font-family: 'Jacquard 12';
        }

        .enviar {
            font-size: 2rem;
            color: rgb(0, 0, 0);
            border: 1.5px solid rgb(76, 0, 252);
            border-radius: 15px;
            padding: 15px;
            margin: 40px auto 0 auto;
            display: block;
            background-color: rgba(208, 155, 255, 0.346);
            font-family: 'Jacquard 12';
        }

        .enviar:hover {
            background-color: rgb(162, 134, 228);
            color: white;
            border: 1px solid rgb(63, 1, 207);
        }
    </style>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="header.js"></script>
    <script src="footer.js"></script>
    <script src="cardxp.js"></script>
</body>

</html>
