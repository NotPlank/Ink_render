<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨Ink Render - 3D Cube Simulator✨</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="bocadillo-mascota.css">
    <link rel="icon" type="image/jpg" href="imagenes/logofavicon.svg">
    


</head>

<body>
    <div class="wrapper">
        <div id="header-placeholder"></div>
        <main>
            <div class="container-fluid col-12 text-center entrada" id="principal">
                <div class="paneles-3d">
                    <div class="xp-v col-9">

                        <div class="xp-t">
                            <span class="text-black">3D Simulator</span>
                            <div>
                                <div class="xp-btn">_</div>
                                <div class="xp-btn">❐</div>
                                <div class="xp-btn close" onclick="window.location.href='index.html'" style="cursor:pointer;" title="Cerrar y volver al inicio">X</div>
                            </div>
                        </div>

                        <!-- Entorno 3D -->
                        <div id="contenedor3d">
                            <!-- Controles sueltos, arriba a la izquierda -->
                            <div class="controles-3d controles-3d-arriba">
                                <button class="btn-suelto" id="btn-modelo" onclick="alternarModelo(this)" title="Cambiar de modelo">♂</button>
                                <button class="btn-suelto" onclick="resetCamara()" title="Restablecer cámara">⟳🎥</button>
                                <button class="btn-suelto" onclick="capturarFoto()" title="Hacer una foto del modelo tal y como se ve ahora">📸</button>
                            </div>

                            <!-- Controles sueltos, abajo a la izquierda: rotación arriba, movimiento abajo -->
                            <div class="controles-3d controles-3d-abajo">
                                <div class="fila-controles-3d">
                                    <button class="btn-suelto" onclick="rotarModelo('izquierda')" title="Girar a la izquierda">⟲</button>
                                    <button class="btn-suelto" onclick="rotarModelo('derecha')" title="Girar a la derecha">⟳</button>
                                </div>
                                <div class="fila-controles-3d">
                                    <button class="btn-suelto" onclick="moverModelo('izquierda')" title="Mover a la izquierda">◀</button>
                                    <button class="btn-suelto" onclick="moverModelo('arriba')" title="Subir">▲</button>
                                    <button class="btn-suelto" onclick="moverModelo('abajo')" title="Bajar">▼</button>
                                    <button class="btn-suelto" onclick="moverModelo('derecha')" title="Mover a la derecha">▶</button>
                                </div>
                            </div>
                        </div>

                        <!-- Editor de Tatuajeo -->
                        <div id="ventana-editor-tatuaje" class="xp-v"
                            style="position: absolute; top: 40px; right: 15px; width: 250px; z-index: 100; display: none; box-shadow: 5px 5px 15px rgba(0,0,0,0.5);">
                            <div class="xp-t">
                                <span class="text-black">Propiedades del Tatuaje</span>
                                <div>
                                    <div class="xp-btn close"
                                        onclick="document.getElementById('ventana-editor-tatuaje').style.display='none'">
                                        X</div>
                                </div>
                            </div>
                            <div class="xp-c p-3 bg-light text-center">
                                <!-- Controles de Posición -->
                                <div class="mb-3">
                                    <div class="d-flex justify-content-center gap-1 mb-1">
                                        <button class="btn-xp rounded"
                                            onclick="moverTatuaje('arriba')">▲</button>
                                    </div>
                                    <div class="d-flex justify-content-center gap-1 mb-1">
                                        <button class="btn-xp rounded"
                                            onclick="moverTatuaje('izquierda')">◀</button>
                                        <button class="btn-xp rounded"
                                            onclick="moverTatuaje('derecha')">▶</button>
                                    </div>
                                    <div class="d-flex justify-content-center gap-1">
                                        <button class="btn-xp rounded"
                                            onclick="moverTatuaje('abajo')">▼</button>
                                    </div>
                                </div>

                                <!-- Controles de Transformación -->
                                <div class="mb-2">
                                    <div class="d-flex flex-wrap justify-content-center gap-2">
                                        <button class="btn-xp rounded" onclick="ajustarEscalaTatuaje(0.04)">➕
                                        </button>
                                        <button class="btn-xp rounded" onclick="ajustarEscalaTatuaje(-0.04)">➖
                                        </button>
                                        <button class="btn-xp rounded" onclick="girarTatuaje(15)">⟳</button>
                                        <button class="btn-xp rounded" onclick="girarTatuaje(-15)">⟲</button>
                                    </div>
                                </div>

                                <!-- Botón de Confirmación -->
                                <div class="mt-3 pt-2 border-top">
                                    <button
                                        class="btn-xp w-100 .bg-secondary.bg-gradient text-dark border border-light rounded-pill"
                                        onclick="fijarTatuajeActual()">✔ Fijar Tatuaje</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Panel tatuajes -->
                    <div class="xp-v panel-tatuajes col-3 mb-5">
                        <div class="xp-t">
                            <span class="text-black">Mis Tatuajes</span>
                            <div>
                                <div class="xp-btn">_</div>
                                <div class="xp-btn">❐</div>
                                <div class="xp-btn close" onclick="window.location.href='index.html'" style="cursor:pointer;" title="Cerrar y volver al inicio">X</div>
                            </div>
                        </div>
                        <div class="xp-c text-start">
                            <label for="subir-tatuaje" class="form-label"
                                style="font-family: sans-serif; font-size: 0.85rem;">
                                Sube tus diseños (PNG, fondo transparente)
                            </label>
                            <div class="posicion-badge">
                                    <span class="badge rounded-pill bg-warning text-black" style="cursor: pointer;"
                                        onclick="alert('Pasa tus tatuajes al modelo 3D haciendo click en las miniaturas cargadas y luego sobre el lugar del cuerpo al que quieras añadirlas.')"> Ayuda❓ </span>
                                </div>
                            <input type="file" id="subir-tatuaje" accept="image/png" multiple class="form-control">
                            <div id="lista-tatuajes">
                                <span class="sin-tatuajes">Aún no has subido ningún tatuaje.</span>
                                </div>

                            <hr>
                            <label class="form-label" style="font-family: sans-serif; font-size: 0.85rem;">
                                Mis Fotos
                            </label>
                            <div id="lista-fotos">
                                <span class="sin-tatuajes">Aún no has hecho ninguna foto.</span>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>

    <div id="footer-placeholder"></div>
    </div>
    <script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
}
</script>


    <script type="module" src="script.js"></script>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="header.js"></script>
    <script src="footer.js"></script>
</body>

</html>
