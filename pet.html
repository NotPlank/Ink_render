<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet</title>
    <link rel="stylesheet" href="csspet.css">
    <link rel="stylesheet" href="bocadillo-mascota.css">
</head>

<body>
    <div class="bocadillo" id="bocadillo"><span id="texto-bocadillo"></span></div>
    <div class="spacio">
        <div class="agujeronegro" id="pet-scale">
            <div class="centro">
                <div class="cara">
                    <div class="ojo izq">


                    </div><!-- fin del ojo izq -->
                    <div class="blush iz"></div>
                    <div class="blush iz2"></div>
                    <div class="blush iz3"></div>
                    <div class="ojo der">


                    </div><!-- fin del ojo der -->
                    <div class="blush der"></div>
                    <div class="blush der2"></div>
                    <div class="blush der3"></div>


                </div><!-- fin del ojos -->

            </div><!-- fin del centro -->
            <div class="hvertical">

            </div><!-- fin del hvertical-->
            <div class="hhorizontal">

            </div><!-- fin del hhorizontal -->

        </div><!-- fin del agujero negro -->
        <div class="estrellas">

        </div><!-- fin del estrellas -->
    </div><!-- Fin del espacio -->
    <!-- Script bocadillos -->
    <script>
        // ============================================================
        // MASCOTA: bocadillos con tips de uso
        // Al hacer clic, va mostrando mensajes de la lista (uno cada
        // vez, en bucle). Si esta página vive en un iframe dentro de
        // 3d.html, además puede recibir un aviso automático desde el
        // script del simulador (por ejemplo, "haz clic en el maniquí").
        // ============================================================

        const bocadillo = document.getElementById('bocadillo');
        const textoBocadillo = document.getElementById('texto-bocadillo');
        const mascota = document.getElementById('pet-scale');

        // Detectamos en qué página estamos embebidos (mismo origen,
        // así que podemos leer la ruta del padre sin problema)
        let paginaActual = '';
        try {
            paginaActual = window.parent.location.pathname.toLowerCase();
        } catch (e) {
            paginaActual = '';
        }
        const enPagina3D = paginaActual.includes('3d.html');

        // Tips específicos del simulador 3D. De momento solo se
        // activan aquí; para añadirlos a otras páginas, se puede
        // comprobar paginaActual de la misma forma más adelante.
        const tips3D = [
            'Sube un PNG en "Mis Tatuajes" y haz clic en su miniatura para seleccionarlo.',
            'Luego haz clic sobre el maniquí, justo donde quieras colocarlo.',
            'Usa la ventana de "Propiedades del Tatuaje" para moverlo, girarlo y ajustar su tamaño antes de fijarlo.',
            'Puedes cambiar de modelo con el botón de arriba a la izquierda.',
            'Haz una foto con el botón 📸 y descárgala luego desde "Mis Fotos".'
        ];
        let indiceTip = 0;
        let temporizadorOcultar = null;

        function mostrarBocadillo(texto) {
    // 1. Inyectamos el bocadillo al BODY de la página principal
    window.parent.document.body.appendChild(bocadillo);

    // 2. Calculamos dónde está el iframe en la pantalla principal
    const frameMascota = window.parent.document.getElementById('pet-frame');
    if (!frameMascota) return;
    const posFrame = frameMascota.getBoundingClientRect();

    // 3. Posicionamos el bocadillo ARRIBA y CENTRADO respecto al iframe
    // Lo centramos horizontalmente en el medio del iframe
    bocadillo.style.left = `${posFrame.left + (posFrame.width / 2)}px`; 
    // Lo colocamos justo por encima del borde superior del iframe
    bocadillo.style.top = `${posFrame.top - 10}px`;

    // 4. Inyectamos el texto y mostramos
    textoBocadillo.textContent = texto;
    bocadillo.classList.add('visible');

    clearTimeout(temporizadorOcultar);
    temporizadorOcultar = setTimeout(() => {
        bocadillo.classList.remove('visible');
    }, 5000);
}

        if (mascota) {
            mascota.addEventListener('click', () => {
                if (!enPagina3D || tips3D.length === 0) return;
                mostrarBocadillo(tips3D[indiceTip]);
                indiceTip = (indiceTip + 1) % tips3D.length;
            });
        }

        // Aviso automático que puede llegar desde script.js (3d.html)
        // cuando el usuario selecciona un tatuaje de la galería.
        window.addEventListener('message', (evento) => {
            if (evento.origin !== window.location.origin) return;
            if (evento.data && evento.data.tipo === 'tip3d' && evento.data.texto) {
                mostrarBocadillo(evento.data.texto);
            }
        });
    </script>
</body>

</html>
