<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet</title>
    <link rel="stylesheet" href="csspet.css">
    <link rel="stylesheet" href="bocadillo-mascota.css">
</head>

<body>
    <div class="bocadillo" id="bocadillo"><span id="texto-bocadillo"></span></div>
    <div class="spacio">
        <div class="agujeronegro" id="pet-scale">
            <div class="centro">
                <div class="cara">
                    <div class="ojo izq">
                    </div><!-- fin del ojo izq -->
                    <div class="ojo der">
                    </div><!-- fin del ojo der -->
                </div><!-- fin del ojos -->

            </div><!-- fin del centro -->
            <div class="hvertical">

            </div><!-- fin del hvertical-->
            <div class="hhorizontal">

            </div><!-- fin del hhorizontal -->

        </div><!-- fin del agujero negro -->
        <div class="estrellas">

        </div><!-- fin del estrellas -->

        <div style="position: fixed ; top: 300px ; right: -30px ; z-index: 999;">
            <a href="https://instagram.com/davidsfgh" target="_blank">
                <img src="imagenes/instagram-Logo.svg" alt="Instagram" style=" height: 5rem; width: 7.5rem; filter: hue-rotate(260deg) saturate(1.8); ">
            </a>
        </div>

    </div><!-- Fin del espacio -->
    <!-- Bocadillos -->
    <script>
        const bocadillo = document.getElementById('bocadillo');
        const textoBocadillo = document.getElementById('texto-bocadillo');
        const mascota = document.getElementById('pet-scale');

        let paginaActual = '';

        try {
            if (window.parent !== window) {
                paginaActual = window.parent.location.pathname.toLowerCase();
            }
        } catch (e) {
            paginaActual = '';
        }

        const enPagina3D = paginaActual.includes('3d.html');

        const tips3D = [
            'Sube un PNG en "Mis Tatuajes" y haz clic en su miniatura para seleccionarlo.',
            'Luego haz clic sobre el maniquí, justo donde quieras colocarlo.',
            'Usa la ventana de "Propiedades del Tatuaje" para moverlo, girarlo y ajustar su tamaño antes de fijarlo.',
            'Puedes cambiar de modelo con el botón de arriba a la izquierda.',
            'Haz una foto con el botón 📸 y descárgala luego desde "Mis Fotos".'
        ];

        const tipsGenerales = [
            'Con el Stencil puedes limpiar el fondo de una foto o dibujo y quedarte solo con las líneas.',
            'En el Simulador 3D puedes probar cómo queda un tatuaje sobre un cuerpo antes de hacerlo.',
            'Todo se procesa en tu navegador: tus imágenes nunca se suben a ningún servidor.'
        ];

        let indiceTip = 0;
        let temporizadorOcultar = null;

        function mostrarBocadillo(texto) {

            // Mover el bocadillo al documento principal
            window.parent.document.body.appendChild(bocadillo);

            const frameMascota = window.frameElement;

            if (!frameMascota) return;

            const posFrame = frameMascota.getBoundingClientRect();

            bocadillo.style.left = `${posFrame.left + (posFrame.width / 2)}px`;
            bocadillo.style.top = `${posFrame.top - 10}px`;

            textoBocadillo.textContent = texto;
            bocadillo.classList.add('visible');

            clearTimeout(temporizadorOcultar);

            temporizadorOcultar = setTimeout(() => {
                bocadillo.classList.remove('visible');
            }, 5000);
        }

        if (mascota) {

            mascota.addEventListener('click', () => {

                // 3D → tips específicos
                // Resto de páginas → tips generales
                const listaTips = enPagina3D ? tips3D : tipsGenerales;

                if (listaTips.length === 0) return;

                mostrarBocadillo(
                    listaTips[indiceTip % listaTips.length]
                );

                indiceTip = (indiceTip + 1) % listaTips.length;
            });
        }

        // Recibir mensajes enviados desde otras partes de la web
        window.addEventListener('message', (evento) => {

            if (evento.origin !== window.location.origin) return;

            if (
                evento.data &&
                evento.data.tipo === 'tip3d' &&
                evento.data.texto
            ) {
                mostrarBocadillo(evento.data.texto);
            }
        });

        //Ojos en movimiento

        function moverOjosPorAngulo(angulo) {
            const ojoIzq = document.querySelector('.ojo.izq');
            const ojoDer = document.querySelector('.ojo.der');
            if (!ojoIzq || !ojoDer) return;

            const posOriginales = {
                izq: { x: 40, y: 80 },
                der: { x: 110, y: 80 }
            };
            const distanciaMax = 5;
            const moverX = Math.cos(angulo) * distanciaMax;
            const moverY = Math.sin(angulo) * distanciaMax;

            ojoIzq.style.left = `${posOriginales.izq.x + moverX}px`;
            ojoIzq.style.top = `${posOriginales.izq.y + moverY}px`;

            ojoDer.style.left = `${posOriginales.der.x + moverX}px`;
            ojoDer.style.top = `${posOriginales.der.y + moverY}px`;
        }

        window.addEventListener('mousemove', (e) => {
            const ojoIzq = document.querySelector('.ojo.izq');
            if (!ojoIzq) return;
            const rect = ojoIzq.getBoundingClientRect();
            const centroX = rect.left + rect.width / 2;
            const centroY = rect.top + rect.height / 2;

            const angulo = Math.atan2(e.clientY - centroY, e.clientX - centroX);
            moverOjosPorAngulo(angulo);
        });

        window.addEventListener('message', (e) => {
            if (e.data && e.data.tipo === 'mirar_porcentaje') {
                const petPorcentajeX = 0.5;
                const petPorcentajeY = 0.9;

                const deltaX = e.data.x - petPorcentajeX;
                const deltaY = e.data.y - petPorcentajeY;

                const angulo = Math.atan2(deltaY, deltaX);
                moverOjosPorAngulo(angulo);
            }
        });
        /// Alerta !

        document.addEventListener("DOMContentLoaded", () => {
            const estilos = document.createElement("style");
            estilos.innerHTML = `
        .signo-alerta {
            position: absolute;
            top: -30px; 
            left: 43%;
            transform: translateX(-30%) scale(0);
            font-size: 2rem;
            font-weight: bold;
            color: #63fff2; 
            text-shadow: 0 0 20px #a460fc, 0 0 20px #5c02c9;
            z-index: 9999;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .signo-alerta.activo {
            transform: translateX(-5%) scale(2.3);
            animation: brincoAlerta 0.6s ease infinite alternate;
        }
        @keyframes brincoAlerta {
            0% { top: 0px; }
            100% { top: 10px; }
        }
    `;
            document.head.appendChild(estilos);

            const contenedorPet = document.getElementById("pet-scale") || document.querySelector(".agujeronegro");

            if (contenedorPet) {
                const alerta = document.createElement("div");
                alerta.className = "signo-alerta";
                alerta.innerText = "!";
                contenedorPet.appendChild(alerta);
                const puedoMostrarExclamacion = (typeof enPagina3D !== 'undefined') ? enPagina3D : false;

                if (puedoMostrarExclamacion) {

                    setTimeout(() => {
                        alerta.classList.add("activo");
                    }, 8000);

                    setInterval(() => {
                        if (!alerta.classList.contains("activo") && Math.random() > 0.3) {
                            alerta.classList.add("activo");
                        }
                    }, 20000);
                }
                contenedorPet.addEventListener("click", () => {
                    alerta.classList.remove("activo");
                });
            }
        });



    </script>
</body>

</html>
